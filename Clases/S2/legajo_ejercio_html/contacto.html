<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto · Blog Obi-Wan</title>
</head>
<body>
    <header>
        <h1>Blog Obi-Wan</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>
    <main>
        <section>
            <h2>Formulario de Contacto</h2>
            <p>Completá el formulario y nos comunicaremos a la brevedad.</p>
            <form action="enviar_contacto.php" method="post">
                <fieldset>
                    <legend>Datos personales</legend>
                    <label for="nombre">Nombre Completo:</label><br>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre completo" required><br><br>
                    <label for="email">Correo electrónico:</label><br>
                    <input type="email" id="email" name="email" placeholder="Ingresa tu correo electrónico" required><br><br>
                    <label for="telefono">Teléfono:</label><br>
                    <textarea id="telefono" name="telefono" rows="5" placeholder="+54 351 000-0000" required></textarea><br><br>
                    <input type="checkbox" id="terminos" name="terminos" required>
                    <label for="terminos">Acepto los términos y condiciones</label> 
                </fieldset>
                <fieldset>
                    <legend>Consulta</legend>
                    <label for="motivo">Motivo del contacto:</label><br>
                    <select id="motivo" name="motivo" required>
                        <option value="">- Selecciona una opción -</option>
                        <option value="consulta">Consulta general</option>
                        <option value="soporte">Soporte técnico</option>
                        <option value="presupuesto">Solicitud de presupuesto</option>
                        <option value="otros">Otros</option>
                    </select><br>
                    <label for="mensaje">Mensaje:</label><br>
                    <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea><br>
                </fieldset>
                <button type="submit">Enviar mensaje</button>
                <button type="reset">Limpiar formulario</button>
            </form>
        </section>
    </main>
    <footer>
        <p>Giuliana Jauregui · 2026</p>
    </footer>
</body>
</html>
